# OpenOCD BScan config — Board B (Responder)
# USB serial: 210319B269F6, UART /dev/ttyUSB3
# GDB port: 3334, Telnet port: 4445

gdb_port 3334
telnet_port 4445
tcl_port 6667

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
adapter serial "210319B269F6"
# Digilent: ADBUS7 = level-shifter output-enable (must be high)
ftdi layout_init 0x0088 0x008b

transport select jtag
adapter speed 1000

jtag newtap xc7a100t tap -irlen 6 -expected-id 0x13631093 -ignore-version
target create riscv.cpu riscv -chain-position xc7a100t.tap

# Nested Tap type (SiFive JTAGTUNNEL), inner IR width = 5
riscv use_bscan_tunnel 5 0

riscv.cpu configure -work-area-phys 0x80000000 -work-area-size 0x10000 -work-area-backup 0

init
halt
# Set mem_access AFTER init/halt so it applies after target examination
riscv set_mem_access progbuf abstract sysbus
echo "Responder board halted via BScan JTAG"
