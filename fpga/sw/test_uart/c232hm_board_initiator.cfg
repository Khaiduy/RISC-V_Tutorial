# OpenOCD config — Board A (Initiator) via C232HM-DDHSL-0 external JTAG
# JTAG signals on PMOD JD:  TDI=JD-0  TMS=JD-1  TCK=JD-2  TDO=JD-3  GND
# UART terminal: /dev/ttyUSB1 (FT2232H Channel B, independent of JTAG)
#
# C232HM wire colors:
#   Orange (ADBUS0) = TCK → JD-2
#   Yellow (ADBUS1) = TDI → JD-0
#   Green  (ADBUS2) = TDO → JD-3
#   Brown  (ADBUS3) = TMS → JD-1
#   Black             GND → GND

source [find interface/ftdi/c232hm.cfg]
# Cable connected to Board A (Initiator) — swap serial if boards are reversed
# To identify which serial goes to which board: unplug one cable and run lsusb
adapter serial FTA6JVAK

transport select jtag
adapter speed 5000

# RISC-V debug DTM: 5-bit IR, direct connection (no Xilinx TAP wrapper)
jtag newtap riscv tap -irlen 5 -ignore-version

target create riscv.cpu riscv -chain-position riscv.tap

gdb_port 3333
telnet_port 4444
tcl_port 6666

init
halt
echo "Initiator board halted via C232HM JTAG"
