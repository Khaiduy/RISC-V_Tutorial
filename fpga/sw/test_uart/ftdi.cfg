# OpenOCD configuration for C232HM-DDHSL-0 (FT232H)

adapter speed 1000
telnet_port 4445

adapter driver ftdi
ftdi_vid_pid 0x0403 0x6014
ftdi_device_desc "C232HM-DDHSL-0"
ftdi_channel 0

# FT232H JTAG pin mapping
# AD0 TCK
# AD1 TDI
# AD2 TDO
# AD3 TMS
# AD4 TRST
# AD5 SRST
ftdi_layout_init 0x0008 0x000b
ftdi_layout_signal nTRST -data 0x0010 -oe 0x0010
ftdi_layout_signal nSRST -data 0x0020 -oe 0x0020

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME_0 $_CHIPNAME.cpu0

target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -rtos hwthread
target smp $_TARGETNAME_0

$_TARGETNAME_0 configure -work-area-phys 0x80000000 -work-area-size 0x00010000 -work-area-backup 1

init
halt

echo "Ready for Remote Connections"
