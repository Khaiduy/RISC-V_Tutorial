# OpenOCD config — Board B (Responder) via C232HM-DDHSL-0 external JTAG
# JTAG signals on PMOD JD:  TDI=JD-0  TMS=JD-1  TCK=JD-2  TDO=JD-3  GND
# UART terminal: /dev/ttyUSB2 (FT2232H Channel B, independent of JTAG)
#
# C232HM wire colors:
#   Orange (ADBUS0) = TCK → JD-2
#   Yellow (ADBUS1) = TDI → JD-0
#   Green  (ADBUS2) = TDO → JD-3
#   Brown  (ADBUS3) = TMS → JD-1
#   Black             GND → GND

source [find interface/ftdi/c232hm.cfg]
# Cable connected to Board B (Responder) — swap serial if boards are reversed
adapter serial FTA6GPSN

transport select jtag
adapter speed 1000

# RISC-V debug DTM: 5-bit IR, direct connection (no Xilinx TAP wrapper)
jtag newtap riscv tap -irlen 5 -ignore-version

target create riscv.cpu riscv -chain-position riscv.tap

gdb_port 3334
telnet_port 4445
tcl_port 6667

init
halt
poll off
echo "Responder board halted via C232HM JTAG"
