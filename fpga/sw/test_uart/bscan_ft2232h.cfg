# OpenOCD config: RISC-V JTAG via BSCANE2 tunneled through onboard FT2232H USB chip
# Arty A7 100T — Channel A = Vivado / BScan JTAG, Channel B = UART (/dev/ttyUSB1)
#
# Usage:
#   openocd -f sw/test_uart/bscan_ft2232h.cfg

# --- Adapter ---
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
# ADBUS: TCK=bit0(out), TDI=bit1(out), TDO=bit2(in), TMS=bit3(out), OE=bit7(out,high)
# Digilent boards use ADBUS7 as output-enable for the JTAG level shifter
ftdi layout_init 0x0088 0x008b

transport select jtag
adapter speed 1000

# --- Xilinx XC7A100T physical JTAG TAP ---
jtag newtap xc7a100t tap -irlen 6 -expected-id 0x13631093 -ignore-version

# --- RISC-V target tunneled through BSCANE2 JTAG_CHAIN=4 (Xilinx USER4, IR=0x23) ---
target create riscv.cpu riscv -chain-position xc7a100t.tap

# JTAGTUNNEL (bscan.scala) uses SiFive's nested TAP protocol: generates TMS internally.
# type=0 (Nested Tap) matches the JTAGTUNNEL implementation.
# value=5 = inner RISC-V JTAG IR width (standard Rocket Chip debug: 5-bit IR)
# USER4 IR (0x23) is automatically used as the outer TAP's DR selection.
riscv use_bscan_tunnel 5 0

# Prefer system bus access (replaces deprecated set_prefer_sba)
riscv set_mem_access sysbus

# Work area: 64KB on-chip SRAM scratchpad at 0x80000000
riscv.cpu configure -work-area-phys 0x80000000 -work-area-size 0x10000 -work-area-backup 0

init
halt
echo "RISC-V core halted via BScan JTAG"
